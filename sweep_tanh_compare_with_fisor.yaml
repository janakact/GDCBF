program: launcher/examples/train_md.py
method: grid
project: tanh_sweep_compare_tanh_scale1

metric:
  goal: maximize
  name: n_reward

parameters:
  seed:
    values: [0, 10, 20]
  env_id:
    values: [30, 31, 32, 33, 34, 35, 36, 37, 38]
  mode:
    values: [10]
  tanh_scale:
    values: [10, 20]

command:
  - python
  - launcher/examples/train_md.py
  - --config
  - configs/train_config.py:r
  - --max_steps
  - 500001
  - ${args}

